<svg class="diagram" viewBox="0 0 1696 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="om-title om-desc">
  <title id="om-title">RAE 위의 복원 경로와 생성 경로, 그리고 고차원에서 바꾸는 곳</title>
  <desc id="om-desc">위: 입력 이미지 → 고정 인코더 → 표현 토큰 → ViT 디코더 → 복원 이미지(① 복원). 아래: 잡음 → DiT → 생성 토큰 → 같은 ViT 디코더 → 생성 이미지(② 생성). 고차원 latent에서 바꾸는 곳: DiT의 폭(토큰 차원 이상), 잡음을 넣는 schedule shift, 디코더 학습 때의 노이즈 증강, 그리고 DiT 뒤의 얕고 넓은 DDT head는 DiT 출력과 잡음 섞인 입력을 함께 받는다.</desc>
  <!-- the file draws the finished picture (beat 3); overview_map.anim.js starts it from the
       reconstruction path alone. Elements the script moves carry data-anim. -->
<g transform="translate(24,0)">

  <!-- ① reconstruction (dimmed while ② is introduced, then back) -->
  <g data-anim="row1">
    <rect x="0" y="60" width="120" height="120" rx="10" fill="var(--color-surface-brand)" stroke="var(--color-text-heading)" stroke-width="3"/><circle cx="86" cy="92" r="14" fill="var(--color-warm)"/><path d="M8 170L44 116L70 150L90 130L114 170Z" fill="var(--color-text-heading)"/>
    <g stroke="var(--color-text-muted)" stroke-width="3" fill="none"><path d="M128 120H188"/><path d="M182 113L190 120L182 127"/></g>
    <rect x="200" y="60" width="220" height="120" rx="12" fill="var(--color-surface-brand)" stroke="var(--color-accent)" stroke-width="3"/>
    <g stroke="var(--color-text-muted)" stroke-width="3" fill="none"><path d="M428 120H648"/><path d="M642 113L650 120L642 127"/></g>
    <g fill="var(--color-accent)"><rect x="660" y="68" width="220" height="12"/><rect x="660" y="88" width="220" height="12"/><rect x="660" y="108" width="220" height="12"/><rect x="660" y="128" width="220" height="12"/><rect x="660" y="148" width="220" height="12"/><rect x="660" y="168" width="220" height="12"/></g>
    <g stroke="var(--color-text-muted)" stroke-width="3" fill="none"><path d="M888 120H980"/><path d="M974 113L982 120L974 127"/></g>
    <g stroke="var(--color-text-muted)" stroke-width="3" fill="none"><path d="M1238 120H1288"/><path d="M1282 113L1290 120L1282 127"/></g>
    <rect x="1300" y="60" width="120" height="120" rx="10" fill="var(--color-surface-brand)" stroke="var(--color-text-heading)" stroke-width="3"/><circle cx="1386" cy="92" r="14" fill="var(--color-warm)"/><path d="M1308 170L1344 116L1370 150L1390 130L1414 170Z" fill="var(--color-text-heading)"/>
  </g>
  <foreignObject x="200" y="60" width="220" height="120"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-box">고정 인코더</div></foreignObject>
  <foreignObject x="-20" y="188" width="160" height="36"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c">입력 이미지</div></foreignObject>
  <foreignObject x="620" y="188" width="300" height="36"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c">표현 토큰</div></foreignObject>
  <foreignObject x="1260" y="188" width="200" height="36"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c">복원 이미지</div></foreignObject>
  <foreignObject x="1450" y="100" width="200" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-h">① 복원</div></foreignObject>

  <!-- the decoder both paths share -->
  <rect data-anim="dec" x="1000" y="60" width="220" height="360" rx="12" fill="var(--color-surface-brand)" stroke="var(--color-accent)" stroke-width="3"/>
  <foreignObject data-anim="dec-label" x="1000" y="60" width="220" height="360"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-box">ViT 디코더</div></foreignObject>

  <!-- ② generation, left to right -->
  <g data-anim="r2-0"><rect x="0" y="300" width="120" height="120" rx="10" fill="var(--color-surface-sunken)" stroke="var(--color-border-control)" stroke-width="3"/><g fill="var(--color-text-muted)"><circle cx="42" cy="324" r="5"/><circle cx="13" cy="393" r="3"/><circle cx="46" cy="314" r="5"/><circle cx="30" cy="317" r="4"/><circle cx="15" cy="317" r="4"/><circle cx="14" cy="367" r="3"/><circle cx="74" cy="369" r="3"/><circle cx="68" cy="349" r="3"/><circle cx="13" cy="397" r="4"/><circle cx="52" cy="364" r="5"/><circle cx="40" cy="393" r="3"/><circle cx="19" cy="367" r="3"/><circle cx="47" cy="365" r="3"/><circle cx="67" cy="372" r="4"/><circle cx="79" cy="352" r="4"/><circle cx="56" cy="404" r="4"/><circle cx="39" cy="391" r="5"/><circle cx="89" cy="317" r="4"/><circle cx="63" cy="399" r="5"/><circle cx="55" cy="371" r="3"/><circle cx="20" cy="351" r="4"/><circle cx="24" cy="359" r="3"/><circle cx="108" cy="316" r="5"/><circle cx="68" cy="399" r="4"/><circle cx="43" cy="344" r="4"/><circle cx="68" cy="355" r="3"/><circle cx="106" cy="357" r="5"/><circle cx="15" cy="384" r="4"/><circle cx="75" cy="411" r="4"/><circle cx="38" cy="348" r="5"/><circle cx="44" cy="406" r="4"/><circle cx="25" cy="320" r="3"/><circle cx="31" cy="338" r="5"/><circle cx="34" cy="349" r="4"/><circle cx="16" cy="355" r="5"/><circle cx="37" cy="322" r="4"/><circle cx="98" cy="337" r="4"/><circle cx="111" cy="379" r="4"/><circle cx="108" cy="324" r="3"/><circle cx="24" cy="376" r="3"/><circle cx="58" cy="369" r="4"/><circle cx="37" cy="323" r="5"/><circle cx="46" cy="367" r="3"/><circle cx="80" cy="362" r="5"/><circle cx="76" cy="385" r="4"/><circle cx="102" cy="389" r="5"/></g><foreignObject x="-20" y="428" width="160" height="36"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c">잡음</div></foreignObject></g>
  <g data-anim="r2-1"><g stroke="var(--color-text-muted)" stroke-width="3" fill="none"><path d="M128 360H180"/><path d="M174 353L182 360L174 367"/></g></g>
  <g data-anim="r2-2"><rect x="200" y="300" width="220" height="120" rx="12" fill="var(--color-text-heading)"/><foreignObject x="200" y="300" width="220" height="120"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-box" style="color:#fff">DiT</div></foreignObject></g>
  <g data-anim="r2-3" stroke="var(--color-text-muted)" stroke-width="3" fill="none">
    <path d="M438 360H452"/>
    <path data-anim="mid" d="M452 360H628" opacity="0" visibility="hidden"/>
    <path d="M628 360H648"/><path d="M642 353L650 360L642 367"/>
  </g>
  <g data-anim="r2-4"><g fill="var(--color-accent)"><rect x="660" y="308" width="220" height="12"/><rect x="660" y="328" width="220" height="12"/><rect x="660" y="348" width="220" height="12"/><rect x="660" y="368" width="220" height="12"/><rect x="660" y="388" width="220" height="12"/><rect x="660" y="408" width="220" height="12"/></g><foreignObject x="620" y="428" width="300" height="36"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c">생성 토큰</div></foreignObject></g>
  <g data-anim="r2-5"><g stroke="var(--color-text-muted)" stroke-width="3" fill="none"><path d="M888 360H980"/><path d="M974 353L982 360L974 367"/></g><g stroke="var(--color-text-muted)" stroke-width="3" fill="none"><path d="M1238 360H1288"/><path d="M1282 353L1290 360L1282 367"/></g><rect x="1300" y="300" width="120" height="120" rx="10" fill="var(--color-surface-brand)" stroke="var(--color-text-heading)" stroke-width="3"/><circle cx="1386" cy="332" r="14" fill="var(--color-warm)"/><path d="M1308 410L1344 356L1370 390L1390 370L1414 410Z" fill="var(--color-text-heading)"/><foreignObject x="1260" y="428" width="200" height="36"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c">생성 이미지</div></foreignObject></g>
  <g data-anim="tag2"><foreignObject x="1450" y="340" width="200" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-h">② 생성</div></foreignObject></g>

  <!-- what changes in high dimension: DiT width, the noise schedule, the decoder's training -->
  <g data-anim="m-width">
    <rect x="190" y="290" width="240" height="140" rx="18" fill="none" stroke="var(--color-warm)" stroke-width="4"/>
    <foreignObject x="210" y="246" width="200" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c" style="font-weight:700;color:var(--color-text-heading)">폭 ≥ 토큰 차원</div></foreignObject>
  </g>
  <g data-anim="m-shift">
    <circle cx="158" cy="360" r="10" fill="var(--color-warm)"/>
    <path d="M158 294V348" stroke="var(--color-warm)" stroke-width="3"/>
    <foreignObject x="78" y="230" width="160" height="32"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c" style="font-weight:700;color:var(--color-text-heading)">schedule</div></foreignObject>
    <foreignObject x="78" y="258" width="160" height="32"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c" style="font-weight:700;color:var(--color-text-heading)">shift</div></foreignObject>
  </g>
  <g data-anim="m-noise">
    <rect x="990" y="50" width="240" height="380" rx="18" fill="none" stroke="var(--color-warm)" stroke-width="4"/>
    <foreignObject x="930" y="436" width="360" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c" style="font-weight:700;color:var(--color-text-heading)">학습 때 노이즈 증강</div></foreignObject>
  </g>

  <!-- DiT^DH: a shallow, wide head after the DiT; it also reads the noisy input -->
  <path data-anim="head-tip" d="M446 353L454 360L446 367" fill="none" stroke="var(--color-text-muted)" stroke-width="3"/>
  <g data-anim="head">
    <rect x="460" y="322" width="160" height="76" rx="10" fill="var(--color-surface-brand)" stroke="var(--color-text-heading)" stroke-width="3"/>
    <foreignObject x="460" y="322" width="160" height="76"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c" style="font-weight:700;color:var(--color-text-heading)">DDT head</div></foreignObject>
  </g>
  <path data-anim="xt" d="M158 370V486H540V408" fill="none" stroke="var(--color-text-heading)" stroke-width="3"/>
  <path data-anim="xt-arrow" d="M533 414L540 404L547 414" fill="none" stroke="var(--color-text-heading)" stroke-width="3"/>
  <g data-anim="xt-label">
    <foreignObject x="180" y="446" width="350" height="34"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c fo-muted">잡음 섞인 입력도 head로</div></foreignObject>
  </g>
</g>
</svg>
