<svg class="diagram" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rl-title rl-desc">
  <title id="rl-title">처방을 하나씩 더한 gFID (Table 2, 4, 5, 6에서 다시 그림)</title>
  <desc id="rl-desc">DINOv2-B RAE, ImageNet 256×256, 80 epoch, guidance 없음, gFID. 기본 DiT-XL 23.08, schedule shift를 더하면 4.81, 노이즈 증강 디코더를 더하면 4.28, wide DDT head와 전용 최적화(App. D)를 쓴 DiT^DH-XL은 2.16. 같은 조건의 SD-VAE DiT-XL은 7.13으로 점선 기준선이다.</desc>

  <!-- axis and grid: gFID 0–25, y(v) = 500 − 17.6·v -->
  <g stroke="var(--color-border-subtle)" stroke-width="2">
    <path d="M120 412H960M120 324H960M120 236H960M120 148H960M120 60H960"/>
  </g>
  <path d="M120 500H960" stroke="var(--color-text-muted)" stroke-width="2"/>
  <foreignObject x="40" y="480" width="64" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-r fo-muted">0</div></foreignObject>
  <foreignObject x="40" y="392" width="64" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-r fo-muted">5</div></foreignObject>
  <foreignObject x="40" y="304" width="64" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-r fo-muted">10</div></foreignObject>
  <foreignObject x="40" y="216" width="64" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-r fo-muted">15</div></foreignObject>
  <foreignObject x="40" y="128" width="64" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-r fo-muted">20</div></foreignObject>
  <foreignObject x="40" y="40" width="64" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-r fo-muted">25</div></foreignObject>
  <foreignObject x="0" y="0" width="300" height="36"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-muted">gFID ↓</div></foreignObject>

  <!-- SD-VAE reference (always visible) -->
  <path d="M120 374.5H960" stroke="var(--color-warm)" stroke-width="3" stroke-dasharray="12 8"/>
  <foreignObject x="560" y="330" width="400" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-r fo-muted">SD-VAE · DiT-XL 7.13</div></foreignObject>

  <!-- step 0: plain DiT-XL on RAE -->
  <rect x="160" y="93.8" width="140" height="406.2" fill="var(--color-text-muted)"/>
  <foreignObject x="130" y="48" width="200" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c fo-h" style="text-shadow:0 0 4px var(--color-bg),0 0 8px var(--color-bg)">23.08</div></foreignObject>
  <foreignObject x="110" y="512" width="240" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c">기본 DiT-XL</div></foreignObject>

  <!-- step 1: + schedule shift -->
  <g data-from-step="1">
    <rect x="360" y="415.3" width="140" height="84.7" fill="var(--color-accent)"/>
    <foreignObject x="330" y="377" width="200" height="38"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c fo-h" style="text-shadow:0 0 4px var(--color-bg),0 0 8px var(--color-bg)">4.81</div></foreignObject>
    <foreignObject x="310" y="512" width="240" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c">+ shift</div></foreignObject>
    <foreignObject x="310" y="552" width="240" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c fo-muted">Table 4</div></foreignObject>
  </g>

  <!-- step 2: + noise-augmented decoder -->
  <g data-from-step="2">
    <rect x="560" y="424.7" width="140" height="75.3" fill="var(--color-accent)"/>
    <foreignObject x="530" y="380" width="200" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c fo-h" style="text-shadow:0 0 4px var(--color-bg),0 0 8px var(--color-bg)">4.28</div></foreignObject>
    <foreignObject x="510" y="512" width="240" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c">+ 노이즈 증강</div></foreignObject>
    <foreignObject x="510" y="552" width="240" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c fo-muted">Table 5</div></foreignObject>
  </g>

  <!-- step 3: + wide DDT head (DiT^DH-XL) -->
  <g data-from-step="3">
    <rect x="760" y="462" width="140" height="38" fill="var(--color-primary)"/>
    <foreignObject x="730" y="417" width="200" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c fo-h" style="text-shadow:0 0 4px var(--color-bg),0 0 8px var(--color-bg)">2.16</div></foreignObject>
    <foreignObject x="710" y="512" width="240" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c">+ DDT head</div></foreignObject>
    <foreignObject x="710" y="552" width="240" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c fo-muted">Table 6 · App. D</div></foreignObject>
  </g>
  <foreignObject x="110" y="552" width="240" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="fo fo-c fo-muted">Table 2</div></foreignObject>
</svg>
